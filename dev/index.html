<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HAKAI PROTOCOL — Dev Mode</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #060610;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
      font-family: 'Orbitron', monospace;
    }
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap');
    .wrap { text-align: center; }
    .title {
      font-size: 13px; font-weight: 700; letter-spacing: 6px;
      color: #7c3aed; margin-bottom: 24px;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: .6; } 50% { opacity: 1; }
    }
    .icon { font-size: 48px; margin-bottom: 16px; }
    .sub { font-size: 10px; letter-spacing: 3px; color: #4b5563; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="icon">⚙</div>
    <div class="title">ACTIVATING DEV MODE...</div>
    <div class="sub">REDIRECTING TO HAKAI PROTOCOL</div>
  </div>
  <script>
    sessionStorage.setItem('hakaiDevMode', '1');
    setTimeout(() => { window.location.href = '../index.html'; }, 900);
  </script>
</body>
</html>
